<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
</head>

<body>

    <header>

        <h1>➕ Add New Blog</h1>

        <p>
            Fill in the details below to publish a new blog.
        </p>

        <hr>

        <nav>

            <a href="index.html"><strong>🏠 Home</strong></a> |
            <a href="add-blog.html"><strong>➕ Add Blog</strong></a>

        </nav>

        <hr>

    </header>

    <main>

        <form>

            <h2>📝 Blog Details</h2>

            <label><strong>Blog Title</strong></label>

            <br><br>

            <input type="text" placeholder="Enter Blog Title" size="50">

            <br><br>

            <label><strong>Author Name</strong></label>

            <br><br>

            <input type="text" placeholder="Enter Author Name" size="50">

            <br><br>

            <label><strong>Email Address</strong></label>

            <br><br>

            <input type="email" placeholder="Enter Email Address" size="50">

            <br><br>

            <label><strong>Category</strong></label>

            <br><br>

            <select>

                <option>Technology</option>
                <option>Programming</option>
                <option>Education</option>
                <option>AI & ML</option>
                <option>General</option>

            </select>

            <br><br>

            <label><strong>Publishing Date</strong></label>

            <br><br>

            <input type="date">

            <br><br>

            <label><strong>Blog Content</strong></label>

            <br><br>

            <textarea rows="10" cols="70" placeholder="Write your blog here..."></textarea>

            <br><br>

            <button type="submit">Publish Blog</button>

            <button type="reset">Clear Form</button>

        </form>

    </main>

    <hr>

    <footer>

        <p><strong>© 2026 Blog Management System</strong></p>

        <p>Developed by <strong>Dev Rastogi</strong></p>

        <p>Codomax Digital Solutions Full Stack Internship</p>

    </footer>

</body>

</html>
